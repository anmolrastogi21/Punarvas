<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9edf1;--panel:#fff;--ink:#1c2733;--mut:#5f6f7e;--line:#c9d2da;--head:#1f4e79;--acc:#2a6fbb;
--imm:#c8402f;--sho:#e0861a;--med:#b59a12;--mon:#7b8a99;--ok:#2e8b57;--ls:#c8402f;--fl:#2a6fbb;--cb:#7b4fa8;--mapbg:#e4e9dd}
:root[data-theme=dark]{--bg:#12171d;--panel:#1b232c;--ink:#e4eaf0;--mut:#93a3b2;--line:#33414f;--head:#16283d;--acc:#5aa2e6;
--imm:#f2705c;--sho:#f0a447;--med:#dcc23c;--mon:#93a3b2;--ok:#4cbf83;--ls:#f2705c;--fl:#5aa2e6;--cb:#b48be0;--mapbg:#1c2622}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
#r{height:100%}
.box{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.mut{color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
th{font-weight:600;font-size:12px;color:var(--mut);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--line)}
tr.row{cursor:pointer}tr.row:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
tr.on{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.maplibregl-map{position:relative;overflow:hidden}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-marker{position:absolute;top:0;left:0;cursor:pointer}
.hm{position:relative;width:0;height:0}
.hm i{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 2px 7px rgba(0,0,0,.45);transition:transform .15s}
.hm:hover i{transform:translate(-50%,-50%) scale(1.15)}
.hm.red i::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--imm);animation:pl 2.2s ease-out infinite;pointer-events:none}
@keyframes pl{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.hm.red i::after{animation:none;opacity:.5}}
.hm b,.sm b{position:absolute;top:-9px;white-space:nowrap;font-size:11px;font-weight:600;line-height:16px;color:var(--ink);background:color-mix(in srgb,var(--panel) 90%,transparent);padding:0 7px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:none}
.sm{position:relative;width:0;height:0}
.sm i{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:6px;background:var(--ok);border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px/1 sans-serif;font-style:normal}
.sm i::before{content:"\2302"}
.sm b{color:var(--ok);left:16px}
.maplibregl-ctrl-attrib{font-size:10px}
:root[data-theme=dark] .maplibregl-ctrl-group{background:#1b232c}
:root[data-theme=dark] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
</style>

<script>
const h=htm.bind(React.createElement),{useState,useEffect,useRef,useMemo}=React;
const HZ=['landslide','flood','cloudburst'];
/* Real event: Meppadi panchayat, Wayanad, 30 July 2024. Village names and the Elstone Estate site are real.
   Coordinates are approximate; households and susceptibility values are indicative inputs, not survey data. */
const HAB=[
{id:'mundakkai',name:'Mundakkai',lon:76.196,lat:11.487,hh:200,V:.70,D:.60,hz:[.88,.70,.55]},
{id:'chooralmala',name:'Chooralmala',lon:76.183,lat:11.480,hh:120,V:.65,D:.45,hz:[.72,.65,.45]},
{id:'attamala',name:'Attamala',lon:76.203,lat:11.492,hh:80,V:.60,D:.50,hz:[.85,.55,.50]},
{id:'punchirimattam',name:'Punchirimattam',lon:76.208,lat:11.500,hh:50,V:.60,D:.55,hz:[.90,.50,.60]},
{id:'vellarimala',name:'Vellarimala',lon:76.215,lat:11.470,hh:60,V:.55,D:.40,hz:[.80,.30,.55]},
{id:'thondernad',name:'Thondernad',lon:76.100,lat:11.530,hh:150,V:.40,D:.30,hz:[.45,.55,.30]},
{id:'meppadi',name:'Meppadi',lon:76.135,lat:11.552,hh:400,V:.20,D:.20,hz:[.35,.50,.25]}];
const SITES=[
{id:'A',name:'Elstone Estate, Kalpetta',lon:76.105,lat:11.605,caps:[410,410,410],suit:82},
{id:'B',name:'Parcel B (placeholder)',lon:76.145,lat:11.525,caps:[200,150,220],suit:70},
{id:'C',name:'Parcel C (placeholder)',lon:76.170,lat:11.560,caps:[120,140,90],suit:64}];
SITES.forEach(s=>{s.cap=Math.min(...s.caps);s.lim=['land','water','services'][s.caps.indexOf(s.cap)]});
const ZONES={
landslide:[[76.200,11.510],[76.218,11.505],[76.222,11.490],[76.205,11.484],[76.188,11.474],[76.176,11.480],[76.185,11.492],[76.196,11.502]],
flood:[[76.176,11.478],[76.170,11.500],[76.155,11.520],[76.140,11.540],[76.132,11.548],[76.140,11.552],[76.152,11.538],[76.168,11.520],[76.182,11.498],[76.186,11.480]],
cloudburst:[[76.205,11.478],[76.225,11.478],[76.228,11.460],[76.208,11.458]]};
const RIVER=[[76.207,11.506],[76.186,11.490],[76.175,11.496],[76.16,11.515],[76.142,11.545]];
const TC={Immediate:'var(--imm)','Short-term':'var(--sho)','Medium-term':'var(--med)',Monitor:'var(--mon)'};
const AC={Normal:'var(--ok)',Watch:'var(--med)',Warning:'var(--sho)',Evacuate:'var(--imm)'};
const DW={h:35,e:25,v:25,d:15},THR=.75;
const tierOf=r=>r>=70?'Immediate':r>=55?'Short-term':r>=35?'Medium-term':'Monitor';
const TL={Immediate:'0-6 months','Short-term':'6-24 months','Medium-term':'2-5 years',Monitor:'monitor only'};
const TIERS=['Immediate','Short-term','Medium-term','Monitor'],STAT=['Candidate','Verified','Rejected'];
const note=s=>!s.site?'No listed site has room. Field survey needed.':'Site '+s.site.id+' is capped by '+s.site.lim+'. '+(s.bk?'Backup '+s.bk.s.id+' is '+Math.abs(s.bk.dist-s.dist).toFixed(1)+' km '+(s.bk.dist>=s.dist?'farther':'closer')+' and capped by '+s.bk.s.lim+'. Backup room may shrink as other villages are placed.':'No backup site has room.');
const alertOf=r=>r<60?'Normal':r<120?'Watch':r<200?'Warning':'Evacuate';
const lv=v=>v>=.75?'Very High':v>=.6?'High':v>=.4?'Moderate':v>=.2?'Low':'Very Low';
const km=(a,b)=>{const d=Math.PI/180,x=(b.lon-a.lon)*d*Math.cos((a.lat+b.lat)/2*d),y=(b.lat-a.lat)*d;return 6371*Math.hypot(x,y)};

function compute(rain,W,budget){
  const r=rain/300,ws=(W.h+W.e+W.v+W.d)||1;
  const L=HAB.map(x=>{
    const [ls,fl,cb]=x.hz,base=Math.max(ls,fl,cb);
    const he=Math.min(1,base+r*(.2*Math.max(ls,cb)+.12*fl));
    const E=Math.min(1,x.hh/200); /* largest ward = full exposure */
    const rpi=Math.round(100*(W.h*he+W.e*E+W.v*x.V+W.d*x.D)/ws);
    return {...x,he,base,rpi,tier:tierOf(rpi),red:he>=THR,raised:base<THR&&he>=THR,dom:HZ[x.hz.indexOf(base)],
      parts:[W.h*he,W.e*E,W.v*x.V,W.d*x.D].map(p=>Math.round(100*p/ws))};
  }).sort((a,b)=>b.rpi-a.rpi||b.hh-a.hh);
  const rem={};SITES.forEach(s=>rem[s.id]=s.cap);
  L.forEach((x,i)=>{
    x.rank=i+1;x.inb=i<budget;if(!x.inb)return;
    const c=SITES.map(s=>({s,c:km(x,s)+(100-s.suit)/12})).sort((a,b)=>a.c-b.c);
    x.opts=c.map(o=>({s:o.s,dist:km(x,o.s),fit:rem[o.s.id]>=x.hh,left:rem[o.s.id]}));
    const b=c.find(o=>rem[o.s.id]>=x.hh);

const P=(lo,la)=>[(lo-76.07)/.18*600,(11.63-la)/.18*600];

    ${SITES.map(x=>{const [px,py]=P(x.lon,x.lat);return h`<g key=${x.id}><rect x=${px-6} y=${py-6} width="12" height="12" style=${{fill:'var(--ok)'}}/><text x=${px+10} y=${py+4} style=${{fill:'var(--ok)',fontSize:11,fontWeight:600}}>${x.name.split(' (')[0]}</text></g>`})}
    ${L.map(x=>{const [cx,cy]=P(x.lon,x.lat),r=4+Math.sqrt(x.hh)*.55;return h`<g key=${x.id} onClick=${()=>setSel(x.id)} style=${{cursor:'pointer'}}><circle cx=${cx} cy=${cy} r=${r} style=${{fill:TC[x.tier],stroke:'var(--ink)',strokeWidth:x.id===sel?3:2,strokeDasharray:x.red?'4 2':'none'}}/><text x=${cx+r+3} y=${cy+4} style=${{fill:'var(--ink)',fontSize:11,fontWeight:600}}>${x.name}</text></g>`})}

/* CARTO basemaps need a free API key (carto.com/basemaps/apikey). app.py swaps the placeholder below for the
   key stored in Streamlit secrets. With no key the map falls back to Esri street tiles (OpenStreetMap's own servers block embedded apps). */
const CK='__CARTO_KEY__',HASK=!!CK&&CK.indexOf('__')!==0;
const cartoUrl=n=>['a','b','c','d'].map(x=>'https://'+x+'.basemaps.cartocdn.com/rastertiles/'+n+'/{z}/{x}/{y}.png?key='+encodeURIComponent(CK));
const ESRI=['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'];
const BASES={
 light:{t:HASK?cartoUrl('voyager'):ESRI,z:19,a:HASK?'&copy; OpenStreetMap contributors &copy; CARTO':'Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors'},
 dark:{t:HASK?cartoUrl('dark_all'):ESRI,z:19,a:HASK?'&copy; OpenStreetMap contributors &copy; CARTO':'Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors'},
 sat:{t:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],z:18,a:'Imagery &copy; Esri, Maxar, Earthstar Geographics'},
 lab:{t:['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],z:18,a:'Labels &copy; Esri'},
 topo:{t:['a','b','c'].map(x=>'https://'+x+'.tile.opentopomap.org/{z}/{x}/{y}.png'),z:17,a:'&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)'}};
const BOUNDS=[[76.07,11.45],[76.25,11.63]];
const actBase=(b,dark)=>b==='map'?(dark?'dark':'light'):b;
const baseStyle=act=>({version:8,
  sources:Object.fromEntries(Object.entries(BASES).map(([k,v])=>[k,{type:'raster',tiles:v.t,tileSize:256,maxzoom:v.z,attribution:v.a}])),
  layers:[{id:'bg',type:'background',paint:{'background-color':'#e4e9dd'}}].concat(Object.keys(BASES).map(k=>({id:'b-'+k,type:'raster',source:k,layout:{visibility:(k===act||(k==='lab'&&act==='sat'))?'visible':'none'}})))});

function MapView({L,lay,dark,sel,setSel,rain,alert}){
  const el=useRef(),map=useRef(),mk=useRef([]),[ready,setReady]=useState(false),[bad,setBad]=useState(false),[base,setBase]=useState('map');
  useEffect(()=>{
    let m,ok=false;
    try{m=map.current=new maplibregl.Map({container:el.current,attributionControl:false,style:baseStyle(actBase('map',dark)),
      bounds:BOUNDS,fitBoundsOptions:{padding:24}})}catch(e){setBad(true);return}
    const t=setTimeout(()=>{if(!ok)setBad(true)},20000);
    m.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    m.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
    m.on('error',()=>{});
    m.on('load',()=>{try{ok=true;
      const cm=['match',['get','hz'],'landslide','#c8402f','flood','#2a6fbb','#7b4fa8'];
      m.addSource('z',{type:'geojson',data:{type:'FeatureCollection',features:Object.entries(ZONES).map(([k,c])=>({type:'Feature',properties:{hz:k},geometry:{type:'Polygon',coordinates:[c.concat([c[0]])]}}))}});
      m.addSource('rv',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:RIVER}}});
      m.addSource('rt',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      m.addLayer({id:'rv',type:'line',source:'rv',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#3d8fd6','line-width':3,'line-opacity':.9}});
      m.addLayer({id:'zf',type:'fill',source:'z',paint:{'fill-color':cm,'fill-opacity':.3}});
      m.addLayer({id:'zl',type:'line',source:'z',paint:{'line-color':cm,'line-width':2}});
      m.addLayer({id:'rtc',type:'line',source:'rt',layout:{'line-cap':'round'},paint:{'line-color':'#ffffff','line-width':['case',['==',['get','s'],1],6.5,4.5],'line-opacity':.7}});
      m.addLayer({id:'rt',type:'line',source:'rt',layout:{'line-cap':'round'},paint:{'line-color':'#1f9d5c','line-width':['case',['==',['get','s'],1],3.5,2.2],'line-dasharray':[2,1.6]}});
      SITES.forEach(x=>{const d=document.createElement('div');d.className='sm';d.title=x.name+' (capacity '+x.cap+' households)';d.innerHTML='<i></i><b>'+x.name.split(' (')[0]+'</b>';new maplibregl.Marker({element:d}).setLngLat([x.lon,x.lat]).addTo(m)});
      setReady(true);}catch(e){setBad(true)}
    });
    return ()=>{clearTimeout(t);try{m.remove()}catch(e){}};
  },[]);
  useEffect(()=>{
    if(!ready)return;const m=map.current,on=Object.keys(lay).filter(k=>lay[k]),act=actBase(base,dark);
    Object.keys(BASES).forEach(k=>m.setLayoutProperty('b-'+k,'visibility',(k===act||(k==='lab'&&act==='sat'))?'visible':'none'));
    m.setPaintProperty('bg','background-color',dark?'#1c2622':'#e4e9dd');
    ['zf','zl'].forEach(id=>m.setFilter(id,['in',['get','hz'],['literal',on]]));
  },[ready,dark,lay,base]);
  useEffect(()=>{
    if(!ready)return;
    map.current.getSource('rt').setData({type:'FeatureCollection',features:L.filter(x=>x.inb&&x.site).map(x=>({type:'Feature',properties:{s:x.id===sel?1:0},geometry:{type:'LineString',coordinates:[[x.lon,x.lat],[x.site.lon,x.site.lat]]}}))});
  },[ready,L,sel]);
  useEffect(()=>{
    if(!ready)return;
    mk.current.forEach(x=>x.remove());mk.current=[];
    L.forEach(x=>{
      const d=document.createElement('div'),s=Math.round(10+Math.sqrt(x.hh)*1.1);
      d.className='hm'+(x.red?' red':'');d.onclick=()=>setSel(x.id);
      d.title=x.name+': '+x.hh+' households, '+x.tier+' (RPI '+x.rpi+')'+(x.red?', Red Zone':'');
      d.innerHTML='<i style="width:'+s+'px;height:'+s+'px;background:'+TC[x.tier]+';border:'+(x.id===sel?'3px solid var(--ink)':'2px '+(x.red?'dashed':'solid')+' var(--ink)')+'"></i><b style="left:'+(Math.round(s/2)+7)+'px">'+x.name+'</b>';
      mk.current.push(new maplibregl.Marker({element:d}).setLngLat([x.lon,x.lat]).addTo(map.current));
    });
  },[ready,L,sel]);
  const fit=()=>{if(map.current)map.current.fitBounds(BOUNDS,{padding:24})};
  const glass={background:'color-mix(in srgb,var(--panel) 92%,transparent)'};
  return h`<div class="relative flex-1 min-h-[340px] box overflow-hidden">
    ${bad?h`<${SvgMap} L=${L} lay=${lay} sel=${sel} setSel=${setSel}/>`:h`<div ref=${el} class="absolute inset-0"></div>`}
    <div class="box absolute top-2 left-2 px-2 py-1 text-[12px] z-10 flex items-center gap-2" style=${glass}><span style=${{width:9,height:9,borderRadius:'50%',background:AC[alert],display:'inline-block'}}></span><span>Rainfall forecast: <b>${rain} mm</b> in 24 h, alert <b style=${{color:AC[alert]}}>${alert}</b></span></div>
    ${!bad&&h`<div class="box absolute top-2 right-2 z-10 flex overflow-hidden text-[12px]" style=${glass}>
      ${[['map','Map'],['sat','Satellite'],['topo','Terrain']].map(([k,n])=>h`<button key=${k} onClick=${()=>setBase(k)} style=${{border:0,borderRadius:0,background:base===k?'var(--acc)':'transparent',color:base===k?'#fff':'var(--ink)'}}>${n}</button>`)}
      <button title="Fit all villages" onClick=${fit} style=${{border:0,borderRadius:0,borderLeft:'1px solid var(--line)',background:'transparent'}}>Fit</button></div>`}
    <div class="box absolute bottom-2 left-2 px-2 py-1 text-[11px] z-10 leading-5" style=${{...glass,maxWidth:'calc(100% - 70px)'}}>
      <span style=${{color:'var(--ls)'}}>■</span> landslide path <span style=${{color:'var(--fl)'}}>■</span> flood <span style=${{color:'var(--cb)'}}>■</span> cloudburst <span style=${{color:'var(--ok)'}}>■</span> candidate site <span style=${{color:'var(--ok)'}}>╌</span> proposed move<br/>
      Dot colour = priority, size = households, pulsing dashed edge = Red Zone. Zone shapes are approximate.</div>
  </div>`;
}

        <div class="min-w-0"><div class="text-[19px] md:text-[26px] font-bold leading-tight tracking-wide">PUNARVAS <span class="hidden sm:inline text-[13px] md:text-[14px] font-normal opacity-80 tracking-normal ml-1">Rehabilitation & Resettlement</span></div>
        <div class="text-[13px] opacity-80">Integrated red zone and relocation planning system. Replay of the 30 July 2024 landslides, Meppadi, Wayanad</div></div></div>
      <div class="flex items-center gap-3"><span class="text-[12px] border border-white/50 px-2 py-0.5 rounded">Prototype</span>
        <button style=${{color:'var(--ink)'}} onClick=${()=>setDark(!dark)}>${dark?'Light mode':'Dark mode'}</button></div>
    </header>
    <div class="flex-1 min-h-0 flex flex-col md:flex-row gap-3 p-3 overflow-auto md:overflow-hidden">
      <aside class="md:w-64 shrink-0 md:overflow-auto flex flex-col gap-3">
        <div class="box p-3"><h3 class="text-[15px] font-semibold mb-2">Rainfall trigger</h3>
          <${Slider} label="Forecast rainfall" val=${rain} min=${0} max=${300} set=${setRain} unit=" mm"/>
          <div class="px-2 py-1 font-semibold text-white rounded text-[13px]" style=${{background:AC[alert]}}>Alert level: ${alert}</div>
          <p class="mut text-[12px] mt-2">Slider stands in for the IMD forecast. Try 60 mm and watch Chooralmala, which was not rated landslide-prone before the event.</p></div>
        <div class="box p-3"><h3 class="text-[15px] font-semibold mb-1">Hazard layers</h3>
          ${HZ.map((k,i)=>h`<label class="flex items-center gap-2 py-0.5"><input type="checkbox" checked=${lay[k]} onChange=${()=>setLay({...lay,[k]:!lay[k]})}/>
            <span style=${{color:'var(--'+['ls','fl','cb'][i]+')'}}>■</span>${k[0].toUpperCase()+k.slice(1)}</label>`)}
          <p class="mut text-[12px] mt-1">Red Zone: susceptibility of 0.75 or more, threshold set by the SDMA.</p></div>
        <div class="box p-3"><h3 class="text-[15px] font-semibold mb-2">Priority weights</h3>
          <${Slider} label="Hazard" val=${W.h} min=${0} max=${100} set=${setw('h')}/>
          <${Slider} label="Exposure" val=${W.e} min=${0} max=${100} set=${setw('e')}/>
          <${Slider} label="Vulnerability" val=${W.v} min=${0} max=${100} set=${setw('v')}/>
          <${Slider} label="Disaster history" val=${W.d} min=${0} max=${100} set=${setw('d')}/>
          <${Slider} label="Villages funded" val=${budget} min=${1} max=${7} set=${setBudget}/>
          <button onClick=${()=>{setW(DW);setBudget(4)}}>Reset</button></div>
        <div class="box p-3 text-[12px] mut"><b style=${{color:'var(--ink)'}}>About the data.</b> Village names, the event and the Elstone Estate township site are real. Coordinates are approximate, and household counts, susceptibility scores and Parcels B and C are indicative placeholders. Not for operational use.</div>
      </aside>
      <main class="flex-1 min-w-0 flex flex-col gap-3">
        <div class="box px-3 py-2 text-[14px]"><b>${red.length} of ${L.length}</b> villages fall in a Red Zone (about ${red.reduce((a,x)=>a+x.hh,0)} households), ${imm} in the Immediate tier. Of ${fund.length} funded, <b>${ok}</b> matched to a site${ok<fund.length?', '+(fund.length-ok)+' need a field survey':''}.</div>
        <${MapView} L=${L} lay=${lay} dark=${dark} sel=${sel} setSel=${setSel} rain=${rain} alert=${alert}/>
      </main>
      <section class="md:w-[24rem] shrink-0 md:overflow-auto flex flex-col gap-3">
        <div class="box p-2"><h3 class="text-[15px] font-semibold px-1 mb-1">Priority list</h3>
          <table class="w-full"><thead><tr><th>#</th><th>Village</th><th>HH</th><th>Hazard</th><th>RPI</th><th>Site</th></tr></thead><tbody>
          ${L.map(x=>h`<tr key=${x.id} class=${'row '+(x.id===sel?'on':'')} onClick=${()=>setSel(x.id)}>
            <td style=${{borderLeft:'5px solid '+TC[x.tier]}}>${x.rank}</td>
            <td><b>${x.name}</b>${x.red?h`<span style=${{color:'var(--imm)'}}> Red</span>`:''}</td>
            <td>${x.hh}</td><td>${x.dom}${x.raised?' (rain)':''}</td><td class="text-[15px] font-bold">${x.rpi}</td>
            <td class="text-[12px]">${x.site?x.site.id:x.inb?'none':'-'}</td></tr>`)}
          </tbody></table>
          <p class="mut text-[12px] px-1 pt-1">Left edge colour: <span style=${{color:'var(--imm)'}}>Immediate</span>, <span style=${{color:'var(--sho)'}}>Short-term</span>, <span style=${{color:'var(--med)'}}>Medium-term</span>, <span style=${{color:'var(--mon)'}}>Monitor</span>. Villages beyond the funded count get no site.</p></div>
        ${s&&h`<div class="box p-3"><h3 class="text-[16px] font-semibold">${s.name}</h3>
          <div class="font-semibold mb-1" style=${{color:TC[s.tier]}}>${s.tier}, RPI ${s.rpi}</div>
          <p class="mb-2">${s.hh} households. Main hazard is ${s.dom} (${lv(s.base)})${s.raised?', pushed over the Red Zone line by the rainfall forecast':''}.
          ${s.site?' Suggested site: '+s.site.name+', '+s.dist.toFixed(1)+' km away.':s.inb?' No listed site has room left. Flag for field survey.':' Outside the funded list.'}</p>
          ${['Hazard','Exposure','Vulnerability','History'].map((n,i)=>h`<div class="flex items-center gap-2 text-[12px] mb-1"><span class="w-24">${n}</span>
            <div class="flex-1 h-2 rounded" style=${{background:'var(--line)'}}><div class="h-2 rounded" style=${{width:Math.min(100,s.parts[i]*2.5)+'%',background:['var(--imm)','var(--sho)','var(--acc)','var(--ok)'][i]}}></div></div>
            <span class="w-6 text-right">${s.parts[i]}</span></div>`)}
          ${s.inb&&h`<div class="mt-3 pt-2" style=${{borderTop:'1px solid var(--line)'}}><h4 class="font-semibold mb-1">Relocation plan</h4>
            <div class="text-[12px] mb-2">Move <b>${s.hh} households</b>. Target window: <b>${TL[s.tier]}</b>${s.tier==='Immediate'?'. Arrange interim shelter now.':'.'}</div>
            <table class="w-full text-[12px]"><thead><tr><th>Site</th><th>km</th><th>Room</th><th>Fit</th></tr></thead><tbody>
            ${s.opts.map(o=>h`<tr key=${o.s.id}><td><b>${o.s.id}</b>${s.site&&o.s.id===s.site.id?' (chosen)':s.bk&&o.s.id===s.bk.s.id?' (backup)':''}</td><td>${o.dist.toFixed(1)}</td><td>${o.left}</td><td>${o.fit?'fits':'no room'}</td></tr>`)}</tbody></table>
            <p class="mut text-[12px] mt-1">${note(s)}</p>
            <div class="flex gap-1 mt-2 items-center text-[12px]"><span>Status:</span>${STAT.map(t=>h`<button key=${t} onClick=${()=>setVer({...ver,[s.id]:t})} style=${{background:(ver[s.id]||'Candidate')===t?'var(--acc)':'var(--panel)',color:(ver[s.id]||'Candidate')===t?'#fff':'var(--ink)'}}>${t}</button>`)}</div>
            <p class="mut text-[12px] mt-1">Model output stays Candidate until a field officer verifies it.</p></div>`}</div>`}
        <div class="box p-3"><h3 class="text-[15px] font-semibold mb-2">Relocation phases</h3>
          <table class="w-full text-[12px]"><thead><tr><th>Tier</th><th>Window</th><th>Villages</th><th>HH</th></tr></thead><tbody>
          ${TIERS.map(t=>{const f=fund.filter(x=>x.tier===t);return h`<tr key=${t}><td style=${{borderLeft:'5px solid '+TC[t]}}>${t}</td><td>${TL[t]}</td><td>${f.length}</td><td>${f.reduce((a,x)=>a+x.hh,0)}</td></tr>`})}</tbody></table>
          <p class="mut text-[12px] mt-1">${fund.filter(x=>ver[x.id]==='Verified').length} of ${fund.length} funded villages verified.</p>
          <button class="mt-1" onClick=${exp}>Export plan (JSON)</button></div>
        <div class="box p-3"><h3 class="text-[15px] font-semibold mb-2">Candidate sites</h3>
          ${SITES.map(x=>{const u=x.cap-rem[x.id];return h`<div class="mb-2"><div class="flex justify-between text-[13px]"><b>${x.id}. ${x.name}</b><span>${u}/${x.cap}</span></div>
            <div class="h-2 rounded" style=${{background:'var(--line)'}}><div class="h-2 rounded" style=${{width:(100*u/x.cap)+'%',background:'var(--ok)'}}></div></div>
            <div class="mut text-[12px]">Limited by ${x.lim}. Assigned: ${fund.filter(v=>v.site&&v.site.id===x.id).map(v=>v.name+' ('+v.hh+')').join(', ')||'none'}</div></div>`})}</div>
      </section>
    </div>
  </div>`;
}
class EB extends React.Component{
  constructor(p){super(p);this.state={e:null}}
  static getDerivedStateFromError(e){return {e}}
  render(){return this.state.e?h`<pre style=${{padding:16,whiteSpace:'pre-wrap'}}>The page failed to start: ${String(this.state.e)}</pre>`:this.props.children}
}
ReactDOM.createRoot(document.getElementById('r')).render(h`<${EB}><${App}/><//>`);
</script>
</body>
</html>
